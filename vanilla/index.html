<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Counter App</title>
</head>

<body>
  <main class="container">
    <h1 class="title">Counter App</h1>
    <div class="digit-number">
      <output class="number" id="number" aria-live="polite">0</output>
    </div>
    <div class="cta-buttons">
      <button type="button" class="btn btn-increase" id="btnIncrease" aria-label="Increase one">
        <i data-lucide="plus" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-reset" id="btnReset" aria-label="Reset value">
        <i data-lucide="rotate-ccw" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-decrease" id="btnDecrease" aria-label="Decrease one">
        <i data-lucide="minus" aria-hidden="true"></i>
      </button>
    </div>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
